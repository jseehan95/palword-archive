<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팰월드 XX일기 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a graph-paper diary — index tabs on top, each episode a dated page, characters as pasted-in cards */
:root{
  --paper:#F2F1F7; --sheet:#FFFFFF; --ink:#1D1A33; --muted:#625D7E; --line:#DAD6E8; --grid:rgba(98,93,126,.07);
  --pink:#D3346F; --pink-soft:#FBE3EC; --teal:#17807B; --chip:#E9E6F3; --shadow:0 1px 0 rgba(29,26,51,.06),0 6px 18px -10px rgba(29,26,51,.25);
  --f-display:"Gaegu","Nanum Pen Script",cursive; --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15132A; --sheet:#1F1C38; --ink:#ECE9F7; --muted:#A39EC2; --line:#332F57; --grid:rgba(163,158,194,.06);
  --pink:#FF6E9E; --pink-soft:#3A2240; --teal:#4CC3BA; --chip:#2A2649; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15132A; --sheet:#1F1C38; --ink:#ECE9F7; --muted:#A39EC2; --line:#332F57; --grid:rgba(163,158,194,.06);
  --pink:#FF6E9E; --pink-soft:#3A2240; --teal:#4CC3BA; --chip:#2A2649; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--pink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}

/* header */
header{padding-block:40px 8px}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,7vw,72px);line-height:1;margin:6px 0 10px;text-wrap:balance;word-break:keep-all}
h1 .heart{color:var(--pink)}
.lede{max-width:62ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}

/* tabs */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;padding:12px 14px 10px;border-bottom:3px solid transparent;font-size:15px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--pink)}
main{padding-block:28px 80px}
.view[hidden]{display:none}
h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px;max-width:65ch}

/* episode spine */
.spine{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-bottom:34px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 4px 8px;min-width:0}
.stamp .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stamp .t{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;text-align:center;word-break:keep-all}
.stamp.wip{border-style:dashed;border-color:var(--pink)}
.stamp:hover{border-color:var(--pink)}
@media (max-width:720px){.spine{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* episode page */
.ep{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0 22px;padding:26px 0;border-top:1px dashed var(--line);scroll-margin-top:70px}
.ep .num{font-family:var(--f-mono);font-size:40px;line-height:1;color:var(--line);font-weight:500}
.ep h3{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ep h3 .heart{color:var(--pink)}
.ep h3 small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--pink-soft);color:var(--pink)}
.pill.wip{background:transparent;border:1px dashed var(--pink);color:var(--pink)}
.ep p{margin:0 0 12px;max-width:68ch}
.ep .note{font-size:13px;color:var(--muted)}
.faces{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.face{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--chip);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.face img{width:100%;height:100%;object-fit:cover;object-position:20% 15%}
details.scenes{background:var(--sheet);border:1px solid var(--line);border-radius:12px;max-width:760px}
details.scenes summary{cursor:pointer;padding:10px 14px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.scenes summary::after{content:"펼치기";font-size:12px;color:var(--muted)}
details.scenes[open] summary::after{content:"접기"}
details.scenes summary::-webkit-details-marker{display:none}
.scene{display:grid;grid-template-columns:48px 120px minmax(0,1fr);gap:4px 12px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px}
.scene .sn{font-family:var(--f-mono);font-size:12px;color:var(--pink);padding-top:2px}
.scene .st{font-weight:600}
.scene .sd{color:var(--muted)}
.next{margin-top:12px;font-size:14px;color:var(--muted);border-left:3px solid var(--teal);padding-left:12px;max-width:68ch}
@media (max-width:600px){.ep{grid-template-columns:1fr}.ep .num{font-size:28px;margin-bottom:4px}.scene{grid-template-columns:40px minmax(0,1fr)}.scene .sd{grid-column:2}}

/* cast */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters select,.filters input{font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.filters input{flex:1 1 160px;min-width:0}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--pink)}
.card .pic{aspect-ratio:4/3;background:#FAFAFD;display:grid;place-items:center;position:relative;max-width:100%}
.card .pic img{width:100%;height:100%;object-fit:contain}
.card .pic .none{font-family:var(--f-display);font-size:22px;color:#9A96B4}
.card .h{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:11px;background:rgba(29,26,51,.78);color:#fff;padding:1px 7px;border-radius:6px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:600;font-size:16px}
.card .en{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.eps{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.eps span{font-family:var(--f-mono);font-size:11px;min-width:20px;text-align:center;border-radius:5px;background:var(--chip);color:var(--muted);padding:0 4px}
.empty{color:var(--muted);padding:30px 0}

/* dialog */
dialog{border:none;border-radius:16px;padding:0;max-width:min(880px,calc(100vw - 24px));width:100%;background:var(--sheet);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(21,19,42,.55)}
.dlg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.dlg .big{background:#FAFAFD;display:grid;place-items:center;min-height:260px}
.dlg .big img{width:100%;height:100%;max-height:70vh;object-fit:contain}
.alts{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--chip)}
.alts button{border:2px solid transparent;border-radius:8px;padding:0;background:#FAFAFD;width:64px;height:48px;overflow:hidden;cursor:pointer}
.alts button[aria-pressed="true"]{border-color:var(--pink)}
.alts img{width:100%;height:100%;object-fit:contain}
.altcap{font-size:12px;color:var(--muted);padding:0 10px 10px;background:var(--chip)}
.info{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.info h4{font-family:var(--f-display);font-size:34px;line-height:1;margin:0}
.info .en{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.info p{margin:0}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.must{background:var(--pink-soft);border-radius:10px;padding:10px 12px}
.must ul{margin:0;padding-left:18px}
.must li{font-size:14px}
.ruler{display:flex;align-items:flex-end;gap:14px;height:150px;padding:24px 4px 0;border-bottom:1px solid var(--line)}
.bar{width:64px;border-radius:6px 6px 0 0;background:var(--chip);position:relative}
.bar.me{background:var(--pink)}
.bar i{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-mono);font-size:11px;white-space:nowrap;color:var(--muted)}
.rlab{display:flex;gap:14px;padding:4px 4px 0;font-size:12px;color:var(--muted)}
.rlab span{width:64px;word-break:keep-all;text-align:center}
.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:18px;line-height:1}
@media (max-width:700px){.dlg{grid-template-columns:1fr}.dlg .big{min-height:200px}}

/* world */
.spheres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:40px}
.sph{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;min-width:0}
.orb{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 9%,transparent 10%),radial-gradient(circle at 50% 55%,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.sph.ghost{border-style:dashed}
.sph.ghost .orb{opacity:.45}
.sph b{display:block;font-size:16px}
.sph span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.spheres{grid-template-columns:repeat(2,minmax(0,1fr))}}
h3.sec{font-family:var(--f-display);font-size:28px;margin:0 0 14px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:40px}
.place{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.place img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.place .tx{padding:10px 12px 12px}
.place b{display:block}
.place .w{font-family:var(--f-mono);font-size:11px;color:var(--pink)}
.place p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.place.noimg .tx{border-top:4px solid var(--chip)}

/* gaps */
.gaps{display:grid;gap:10px;max-width:760px}
.gap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px}
.gap b{font-weight:600}
.gap span{color:var(--muted);font-size:14px}
@media (max-width:560px){.gap{grid-template-columns:1fr}}
.extras{margin-top:26px}.extras #extras{display:flex;flex-wrap:wrap;gap:6px}.xp{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}.xp i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding-block:20px 40px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.card,.stamp{transition:border-color .15s,transform .15s}.card:hover{transform:translateY(-2px)}}

.langbtn{margin-left:auto;flex:none;align-self:center;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 4px;display:flex;gap:2px}
.langbtn button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.langbtn button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>

</head><body>
<header class="wrap">
  <div class="kicker">작은오류 · PALWORLD ANIMATION</div>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="stats" id="stats"></div>
</header>
<nav><div class="wrap tabs">
  <a href="#story" data-v="story" data-t="tabStory"></a>
  <a href="#cast" data-v="cast" data-t="tabCast"></a>
  <a href="#world" data-v="world" data-t="tabWorld"></a>
  <div class="langbtn" role="group" aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="en">EN</button></div>
</div></nav>

<main class="wrap">
  <section class="view" id="v-story">
    <h2 data-t="tabStory"></h2>
    <p class="sub" data-t="storySub"></p>
    <div class="spine" id="spine"></div>
    <div id="eplist"></div>
  </section>

  <section class="view" id="v-cast" hidden>
    <h2 data-t="tabCast"></h2>
    <p class="sub" data-t="castSub"></p>
    <div class="filters">
      <div id="gchips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      <select id="epsel"></select>
      <input id="q" type="search">
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="extras"><div class="lbl" data-t="extras"></div><div id="extras"></div></div>
  </section>

  <section class="view" id="v-world" hidden>
    <h2 data-t="tabWorld"></h2>
    <p class="sub" data-t="worldSub"></p>
    <div class="spheres" id="spheres"></div>
    <h3 class="sec" data-t="places"></h3>
    <div class="places" id="places"></div>
    <h3 class="sec" data-t="props"></h3>
    <div class="places" id="props"></div>
  </section>
</main>

<footer class="wrap" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlg-name"><div style="position:relative">
  <button class="close" id="dlg-close" aria-label="Close">×</button>
  <div class="dlg">
    <div style="display:flex;flex-direction:column;min-width:0"><div class="big"><img id="dlg-img" alt=""></div><div class="alts" id="dlg-alts"></div><div class="altcap" id="dlg-cap"></div></div>
    <div class="info" id="dlg-info"></div>
  </div>
</div></dialog>

<script>
// 팰월드 XX일기 아카이브 데이터 (한/영) — 2026-11-03
window.ARCHIVE = {
updated: "2026-11-03",
episodes: [
 {n:1, ko:"신혼일기", en:"Honeymoon", live:true, yt:"https://youtu.be/VQn01CZmNHE",
  sum:"만복이 팰파고스에 도착해 첫 팰들을 잡기 시작한다. 아누비스 곁에 있던 세크메트도 이때 만복에게 온다. 자리를 좀 잡자마자 조이에게 붙잡힌다.",
  sumEn:"Manbok lands in Palpagos and starts catching his first Pals. Sekhmet leaves Anubis's side and joins him. Just as he's settling in, Zoe captures him.",
  cast:["manbok","sekhmet","anubis","joy"]},
 {n:2, ko:"탈출일기", en:"Escape", live:true, yt:"https://youtu.be/2rnTBn3tLp8",
  sum:"조이의 캠프에서 강제 노동을 하지만 팰 능력이 없는 인간이라 쫓겨난다. 떠돌다 사막 해안에 떠밀려 핑크뇽에게 붙잡힌다. 기다리다 지친 까부냥과 세크메트가 만복을 찾아 나서 구해내고, 핑크뇽도 일행에 합류한다.",
  sumEn:"Forced to work at Zoe's camp, Manbok gets thrown out for being a human with no Pal skills. He drifts until he washes up on a desert shore, where a Lovander captures him. Tired of waiting, Cattiva and Sekhmet go looking for him and rescue him, and the Lovander joins the group.",
  cast:["manbok","joy","pinky","kkabu","sekhmet"]},
 {n:3, ko:"해방일기", en:"Liberation", live:true, yt:"https://youtu.be/8iN_1H_-U3E",
  sum:"만복이 인간 사냥에 나서 거점을 인간 노동으로 돌아가게 바꾸고, 팰들을 일에서 해방시킨다. 새 팰들도 얻고, 끝에서 조이의 기지를 칠 복수를 준비한다.",
  sumEn:"Manbok goes on a human-catching spree and turns his base into one that runs on human labor, so his Pals can be free. He gains new Pals and prepares a revenge raid on Zoe's base.",
  cast:["manbok","joy"]},
 {n:4, ko:"복수일기", en:"Revenge", live:true, yt:"https://youtu.be/1bVx01tUt3U",
  sum:"복수하러 간 조이의 기지는 이미 빅터 일당의 습격을 받고 있다. 만복은 복수를 접고 조이를 지키다 붙잡혀 빅터의 실험시설로 끌려간다. 감방에서 캐티메이지를 만나 기운을 북돋아준다. 끝에서 만복의 팰들과 조이가 손잡고 구출에 나선다.",
  sumEn:"Manbok arrives for revenge, but Zoe's base is already under attack by Victor's group. He drops his grudge and fights to defend Zoe, only to be captured and taken to Victor's lab. In his cell he meets Katress and cheers her up. Manbok's Pals and Zoe team up to rescue him.",
  cast:["manbok","joy","vic","mage"]},
 {n:5, ko:"구출일기", en:"Rescue", live:true, yt:"https://youtu.be/yLgkznXUEyQ",
  sum:"빅터가 루나리스와 만복에게 실험을 하려 한다. 캐티메이지가 감방을 탈출해 만복을 구하러 가고, 조이와 팰들의 기지 공격이 시선을 끈다. 빅터의 팰 제노그리프가 막아서지만, 라피에르가 캐티메이지를 구하고, 조이가 틈을 만들고, 리팡이 공격력을 올려준 만복의 일격으로 승리한다. 빅터는 붙잡혀 만복의 거점으로 끌려온다.",
  sumEn:"Victor prepares an experiment on Lunaris and Manbok. Katress breaks out of her cell to save him, while Zoe and the Pals storm the base as a distraction. Victor's Shadowbeak steps in, but Dupin saves Katress, Zoe opens a gap, Leafan boosts Manbok's power, and his final blow wins the fight. Victor is captured and hauled back to Manbok's base.",
  cast:["manbok","vic","mage","joy","rapi","pang","luna"]},
 {n:6, ko:"온천일기", en:"Hot Spring", live:true, yt:"https://youtu.be/IHWmoaJB2YY",
  sum:"빅터를 잡은 뒤 다 같이 온천으로 쉬러 간다. 밤에 친구의 기척을 느낀 캐티메이지가 몰래 나가고, 얀데리나가 눈치챈다. 세계수에 오염되어 광폭화한 마호가 캐티메이지를 공격하고, 막아선 얀데리나의 무기를 쳐낸다. 캐티메이지가 마호를 끌어안자 잠시 제정신이 든 마호는 캐티메이지를 해치지 않으려고 절벽에서 몸을 던진다. 온천에서 친해진 스틱툴라가 거미줄로 받아낸다. 그리고 세계수가 울린다.",
  sumEn:"After capturing Victor, everyone heads to a hot spring to rest. That night Katress senses an old friend and slips out, and Splatterina notices. The friend is Wixen, corrupted by the World Tree and rampaging. Wixen disarms Splatterina, so Katress hugs him. He comes to his senses for a moment and throws himself off the cliff so he can never hurt her. The Tarantriss Manbok befriended at the spring catches him in a web. Then the World Tree rumbles.",
  cast:["manbok","mage","mahu","yande","taran","vic"]},
 {n:7, ko:"원정일기", en:"The Expedition", live:true, yt:"https://youtu.be/I2fFhOS65Yw",
  sum:"마호가 끝내 오염으로 세상을 떠나고, 캐티메이지는 마호의 털을 담은 펜던트를 목에 건다. 만복은 세계수를 열 키스피어를 모으러 떠난다. 조이는 순순히, 릴리는 리팡을 껴안은 뒤, 액셀은 사우나 대결에서 진 뒤 키스피어를 건넨다. 사막으로 간 만복과 핑크뇽·세크메트는 밀매상에게 습격당한 핑크뇽의 옛 거점을 구한다. 한편 세계수의 포털로 나온 모노크로나는 사막에 떨어진다.",
  sumEn:"Wixen passes away from the corruption, and Katress starts wearing a pendant with a tuft of his fur. Manbok sets out to gather the orbs that open the World Tree. Zoe hands hers over willingly, Lily gives hers after getting to hug Leafan, and Axel gives his after losing a sauna showdown. In the desert, Manbok, Lovander and Sekhmet save Lovander's old home from black marketeers. Meanwhile a Solenne walks out of a portal in the World Tree and ends up in the desert.",
  cast:["manbok","mage","mahu","cosh","taran","mulbo","kkabu","joy","sylfia","everheart","pang","lyn","maji","bebi","luna","axe","jex","rob","vic","mono","alok","drilly","goldo","yande","sekhmet","pinky","doma","helgo","amsang","paca","pierce","dubi","thundi"]},
 {n:8, ko:"소탕일기", en:"The Raid", live:true, yt:"https://youtu.be/c_Hsz4VnboQ",
  sum:"두더비의 고향 사막마을. 마커스가 퍼뜨린 해피필로 무너진 마을과, 마커스와 한패인 부패 자경단을 소탕하고 감옥에 갇힌 팰들을 구한다. 서장에게서 경매장 VIP 블랙카드를 얻는다.",
  sumEn:"Fuddler's hometown in the desert has been wrecked by Marcus's Happy Pills and a corrupt vigilante squad working with him. Manbok and Sekhmet take them down, free the jailed Pals, and get a VIP black card to the auction house from the chief.",
  cast:["manbok","sekhmet","pinky","dubi","thundi","sando","residents","maku","guards","vil","miho","dochi","chief","zzino","goldo","yobi","anubis","rich","cherry"]},
 {n:9, ko:"", en:"", live:false, yt:"",
  sum:"서장에게서 얻은 VIP 블랙카드로 마커스의 팰 경매장에 잠입한다. 정장을 차려입은 만복과 함께 팰들이 저마다의 변장으로 흩어진다.",
  sumEn:"With the VIP black card in hand, Manbok sneaks into Marcus's Pal auction in a suit, while his Pals scatter in disguises of their own.",
  cast:["manbok","mage","mulbo","kkabu","rapi","fatbird","taran","rich","maku","cherry"]}

  const lb=ev.target.closest(".langbtn button");if(lb){L=lb.dataset.lang;try{localStorage.setItem("lang",L)}catch(e){}render();return}
  const f=ev.target.closest(".face,.card");if(f)openChar(f.dataset.id);
  const ch=ev.target.closest("#gchips .chip");if(ch){G=ch.dataset.g;document.querySelectorAll("#gchips .chip").forEach(x=>x.setAttribute("aria-pressed",x===ch));renderCast()}
});
$("#epsel").addEventListener("change",e=>{EP=e.target.value;renderCast()});
$("#q").addEventListener("input",e=>{Q=e.target.value.trim().toLowerCase();renderCast()});

const dlg=$("#dlg");
$("#dlg-close").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
function openChar(id){
  const c=byId[id];if(!c)return;
  const li=L==="ko"?1:2;
  const imgs=c.img?[[c.img,t("main"),t("main")],...(c.alts||[])]:[];
  const show=i=>{const im=imgs[i];$("#dlg-img").src=imgSrc(im[0]);$("#dlg-img").alt=nm(c)+" · "+im[li];$("#dlg-cap").textContent=imgs.length>1?im[li]:"";document.querySelectorAll("#dlg-alts button").forEach((b,j)=>b.setAttribute("aria-pressed",i===j))};
  $("#dlg-alts").innerHTML=imgs.length>1?imgs.map((im,i)=>`<button data-i="${i}" title="${esc(im[li])}" aria-label="${esc(im[li])}"><img src="${imgSrc(im[0])}" alt=""></button>`).join(""):"";
  $("#dlg-alts").hidden=imgs.length<2;$("#dlg-cap").hidden=imgs.length<2;
  $("#dlg-alts").onclick=e=>{const b=e.target.closest("button");if(b)show(+b.dataset.i)};
  if(imgs.length)show(0);else{$("#dlg-img").removeAttribute("src");$("#dlg-img").alt=t("noimg")}
  const H=180,max=Math.max(H,c.h||0),mb=byId.manbok;
  const ruler=c.h&&c.id!=="manbok"?`<div><div class="lbl">${t("height")}</div><div class="ruler"><div class="bar" style="height:${H/max*100}%"><i>180</i></div><div class="bar me" style="height:${c.h/max*100}%"><i>${c.h}</i></div></div><div class="rlab"><span>${esc(nm(mb))}</span><span>${esc(nm(c))}</span></div></div>`:"";
  const must=L==="ko"?c.must:c.mustEn;
  $("#dlg-info").innerHTML=`<div><h4 id="dlg-name">${esc(nm(c))}</h4><div class="en">${esc(sub(c))}${c.h?" · "+c.h+"cm":""}</div></div>
   <p>${esc(L==="ko"?c.role:c.roleEn)}</p>
   ${must&&must.length?`<div class="must"><div class="lbl">${t("design")}</div><ul>${must.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}
   ${ruler}
   <div><div class="lbl">${t("appears")}</div><div class="eps">${c.eps.length?c.eps.map(n=>`<span>${t("ep")(n)}</span>`).join(""):`<span>${t("none")}</span>`}</div></div>`;
  dlg.showModal();
}

const views=["story","cast","world"];
function route(){
  let h=location.hash.slice(1)||"story",target=null;
  if(/^ep\d$/.test(h)){target=h;h="story"}
  if(!views.includes(h))h="story";
  views.forEach(v=>{$("#v-"+v).hidden=v!==h});
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===h?"page":"false"));
  if(target){const el=document.getElementById(target);el&&el.scrollIntoView()}else window.scrollTo(0,0);
}
render();
addEventListener("hashchange",route);route();
})();
</script>

</body></html>
